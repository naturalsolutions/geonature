<small>{{ label }}</small>
<input
  class="form-control form-control-sm"
  type="text"
  [placeholder]="placeholder"
  [attr.aria-label]="label"
  [formControl]="formControl"
/>
<!-- mettre le placeholder dans les fichiers de traductions -->
<div *ngIf="formControl?.hasError('invalidUuid') && (formControl?.touched || formControl?.dirty)">
  <small class="error">{{ 'DynamicForm.Errors.InvalidUuid' | translate }}</small>
</div>
