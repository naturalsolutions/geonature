<label
  class="mb-0"
  [for]="inputId"
>
  <small>{{ label }}</small>
</label>
<ng-select
  [ngClass]="class"
  [labelForId]="inputId"
  [items]="destinations"
  [bindValue]="bindValue"
  bindLabel="label"
  placeholder="Destination"
  [multiple]="multiSelect"
  [clearable]="clearable"
  [virtualScroll]="true"
  [formControl]="parentFormControl"
  (clear)="onClear.emit()"
  data-qa="destinations"
>
  <ng-template
    ng-option-tmp
    let-item="item"
    let-index="index"
    let-search="searchTerm"
  >
    <div
      matTooltip="{{ item.code }}"
      [attr.data-qa]="item.code"
    >
      <span class="pre-wrap">{{ item.label }}</span>
    </div>
  </ng-template>
</ng-select>
