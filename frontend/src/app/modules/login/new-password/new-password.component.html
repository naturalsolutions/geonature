<div
  id="login-body"
  style="background: url({{ this.config.API_ENDPOINT }}{{
    this.config.STATIC_URL
  }}/images/login_background.jpg) center; background-size:cover;"
>
  <div class="container">
    <div class="row">
      <div class="col-sm-9 col-md-7 col-lg-5 mx-auto">
        <div
          class="panel panel-default panel-signin"
          style="padding: 20px"
        >
          <div class="panel-heading">
            <div
              class="float-left"
              *ngIf="login_recovery || password_recovery"
            >
              <button
                mat-mini-fab
                (click)="login_recovery = false; password_recovery = false"
                [attr.aria-label]="'Back' | translate"
              >
                <mat-icon>arrow_back</mat-icon>
              </button>
            </div>
            GEONATURE
          </div>
          <div class="panel-body">
            <form
              [formGroup]="form"
              (submit)="submit()"
            >
              <div class="form-group">
                <i
                  class="addon fa fa-user"
                  aria-hidden="true"
                ></i>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  [placeholder]="'Authentication.NewPassword.FormLabel' | translate"
                  formControlName="password"
                />
                <small *ngFor="let error of getPasswordErrors()">
                  <span
                    *ngIf="form.get('password').touched && form.get('password').dirty"
                    style="display: block"
                  >
                    {{ error }}
                  </span>
                </small>
              </div>

              <div class="form-group">
                <i
                  class="addon fa fa-user"
                  aria-hidden="true"
                ></i>
                <input
                  type="password"
                  class="form-control"
                  id="password_confirmation"
                  [placeholder]="'MyAccount.PasswordConfirmation' | translate"
                  formControlName="password_confirmation"
                />
                <small
                  *ngIf="
                    form.get('password_confirmation').hasError('required') &&
                    form.get('password_confirmation').touched
                  "
                >
                  {{ 'Authentication.SignUp.FieldRequired' | translate }}
                </small>
                <small
                  *ngIf="
                    form.hasError('similarError') && !form.get('password_confirmation').pristine
                  "
                >
                  {{ 'Authentication.SignUp.ConfirmationError' | translate }}
                </small>
              </div>
              <button
                [disabled]="form.invalid"
                class="btn btn-lg btn-success btn-block text-uppercase"
                type="submit"
              >
                {{ 'Authentication.NewPassword.Submit' | translate }}
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
